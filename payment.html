<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelEase - Payment</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Poppins, sans-serif;
    background: linear-gradient(135deg,#dbeafe,#f3e8ff,#fce7f3);
    min-height: 100vh;
    color: #243047;
}

header {
    background: linear-gradient(100deg,#4338ca,#9333ea,#db2777);
    color: white;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    font-size: 25px;
}

header a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 650px;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 22px;
    box-shadow: 0 10px 35px #0002;
}

h1 {
    text-align: center;
    color: #4338ca;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
}

.amount-box {
    background: linear-gradient(110deg,#4338ca,#9333ea);
    color: white;
    padding: 25px;
    border-radius: 16px;
    text-align: center;
    margin-bottom: 25px;
}

.amount-box h2 {
    font-size: 35px;
    margin-top: 8px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-weight: 600;
}

input, select {
    width: 100%;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-family: inherit;
    outline: none;
}

input:focus, select:focus {
    border-color: #7c3aed;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    background: linear-gradient(100deg,#16a34a,#059669);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.note {
    margin-top: 18px;
    color: #64748b;
    font-size: 12px;
    text-align: center;
}
</style>
</head>

<body>

<header>
    <h2>✈ TravelEase</h2>
    <a href="index.html">Home</a>
</header>

<div class="container">

    <h1>Complete Your Booking</h1>
    <p class="subtitle">Review your amount and confirm your booking</p>

    <div class="amount-box">
        <p>Total Booking Amount</p>
        <h2>₹<span id="paymentAmount">0</span></h2>
    </div>

    <form id="paymentForm">

        <label>Payment Method</label>

        <select id="paymentMethod" required>
            <option value="">Select Payment Method</option>
            <option value="UPI">UPI</option>
            <option value="Debit Card">Debit Card</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Cash">Cash</option>
        </select>

        <label>UPI ID / Payment Reference (Demo)</label>

        <input
            type="text"
            id="paymentReference"
            placeholder="Enter UPI ID or reference number"
            required
        >

        <button type="submit">Confirm Booking →</button>

    </form>

    <p class="note">
        Demo project only. No real payment will be processed.
    </p>

</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { collection, doc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const waitForUser = () => new Promise(resolve => {
    const unsubscribe = onAuthStateChanged(auth, user => {
        unsubscribe();
        resolve(user);
    });
});

function makeJourneyId(source, destination, date, transport, transportName) {
    return [source, destination, date, transport, transportName]
        .map(value => String(value || "").trim().toLowerCase())
        .join("__")
        .split("/")
        .join("%2F");
}

const amount = Number(localStorage.getItem("totalAmount")) || 0;
document.getElementById("paymentAmount").textContent = amount.toLocaleString("en-IN");

document.getElementById("paymentForm").addEventListener("submit", async event => {
    event.preventDefault();

    const user = await waitForUser();
    if (!user) {
        alert("Please log in before confirming your booking.");
        location.href = "login.html";
        return;
    }

    if (amount <= 0) {
        alert("Booking amount is zero. Please select your seats again.");
        location.href = "seat.html";
        return;
    }

    const method = document.getElementById("paymentMethod").value;
    const reference = document.getElementById("paymentReference").value.trim();
    if (!method || !reference) {
        alert("Please complete the payment details.");
        return;
    }

    const passenger = JSON.parse(localStorage.getItem("passengerDetails") || "{}");
    const seats = JSON.parse(localStorage.getItem("selectedSeats") || "[]");
    if (!seats.length) {
        alert("No seats selected. Please select seats again.");
        location.href = "seat.html";
        return;
    }

    const source = localStorage.getItem("source") || "";
    const destination = localStorage.getItem("destination") || "";
    const date = localStorage.getItem("journeyDate") || "";
    const transport = localStorage.getItem("selectedTransportType") || localStorage.getItem("transportMode") || "Travel";
    const transportName = localStorage.getItem("selectedTransportName") || "";
    const journeyId = makeJourneyId(source, destination, date, transport, transportName);

    const bookingRef = doc(collection(db, "bookings"));
    const bookingId = "TE" + bookingRef.id.slice(-10).toUpperCase();
    const booking = {
        bookingId,
        userId: user.uid,
        passenger: {
            name: passenger.name || "",
            age: passenger.age || "",
            gender: passenger.gender || "",
            email: passenger.email || user.email || "",
            phone: passenger.phone || ""
        },
        name: passenger.name || "",
        phone: passenger.phone || "",
        source, destination, date, journeyDate: date,
        transport, transportName,
        journeyId,
        seats,
        amount,
        fare: amount,
        paymentMethod: method,
        paymentReference: reference,
        paymentStatus: "Demo - not processed",
        status: "Confirmed",
        bookingDate: new Date().toISOString(),
        createdAt: serverTimestamp()
    };

    try {
        await runTransaction(db, async transaction => {
            const seatRefs = seats.map(seat =>
                doc(db, "bookedSeats", `${journeyId}__${seat}`)
            );
            const seatSnapshots = [];
            for (const seatRef of seatRefs) {
                seatSnapshots.push(await transaction.get(seatRef));
            }

            const alreadyTaken = seatSnapshots
                .map((snapshot, index) => snapshot.exists() ? seats[index] : null)
                .filter(Boolean);

            if (alreadyTaken.length) {
                throw new Error("ALREADY_BOOKED:" + alreadyTaken.join(", "));
            }

            transaction.set(bookingRef, booking);

            seatRefs.forEach((seatRef, index) => {
                transaction.set(seatRef, {
                    journeyId,
                    seatNumber: seats[index],
                    bookingId,
                    userId: user.uid,
                    status: "Booked",
                    createdAt: serverTimestamp()
                });
            });
        });

        localStorage.setItem("latestBooking", JSON.stringify({
            ...booking,
            createdAt: new Date().toISOString()
        }));
        localStorage.setItem("bookingId", bookingId);
        location.href = "confirmation.html";
    } catch (error) {
        console.error("Booking error:", error);
        if (error.message.startsWith("ALREADY_BOOKED:")) {
            alert("Sorry! These seats have just been booked by someone else: " +
                error.message.replace("ALREADY_BOOKED:", "") +
                ". Please choose different seats.");
            location.href = "seat.html";
        } else {
            alert("Could not save your booking. " + error.message);
        }
    }
});
</script>

</body>
</html>
