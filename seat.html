<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelEase - Seat Selection</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .seat-legend {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
        }

        .legend-box {
            width: 17px;
            height: 17px;
            border-radius: 4px;
        }

        .available-color { background: #22c55e; }
        .booked-color { background: #ef4444; }
        .selected-color { background: #2563eb; }
        .waiting-color { background: #facc15; }

        .seat-btn {
            min-width: 48px;
            min-height: 42px;
            margin: 6px;
            border: none;
            border-radius: 7px;
            background: #22c55e;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .seat-btn.selected {
            background: #2563eb !important;
            color: white;
        }

        .seat-btn.booked {
            background: #ef4444 !important;
            color: white;
            cursor: not-allowed;
        }

        .seat-btn:disabled {
            opacity: 1;
        }

        .waiting-section {
            display: none;
            background: #fff7d6;
            border: 1px solid #facc15;
            padding: 18px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .waiting-section button {
            background: #ca8a04;
            color: white;
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            margin-top: 10px;
        }

        .waiting-message {
            margin-top: 12px;
            font-weight: 600;
        }

        .seat-layout {
            margin: 20px 0;
        }
    </style>
</head>

<body>

<header class="navbar">
    <h2>TravelEase</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="mybookings.html">My Bookings</a>
    </nav>
</header>

<main class="page-container">

    <h1>Select Your Seats</h1>

    <div class="card">

        <h3>Choose Available Seats</h3>

        <div class="seat-legend">

            <div class="legend-item">
                <span class="legend-box available-color"></span>
                Available
            </div>

            <div class="legend-item">
                <span class="legend-box booked-color"></span>
                Booked
            </div>

            <div class="legend-item">
                <span class="legend-box selected-color"></span>
                Selected
            </div>

            <div class="legend-item">
                <span class="legend-box waiting-color"></span>
                Waiting List
            </div>

        </div>

        <div class="seat-layout" id="seatLayout">

            <button class="seat-btn" data-seat="A1">A1</button>
            <button class="seat-btn" data-seat="A2">A2</button>
            <button class="seat-btn" data-seat="A3">A3</button>
            <button class="seat-btn" data-seat="A4">A4</button>

            <button class="seat-btn" data-seat="B1">B1</button>
            <button class="seat-btn" data-seat="B2">B2</button>
            <button class="seat-btn" data-seat="B3">B3</button>
            <button class="seat-btn" data-seat="B4">B4</button>

            <button class="seat-btn" data-seat="C1">C1</button>
            <button class="seat-btn" data-seat="C2">C2</button>
            <button class="seat-btn" data-seat="C3">C3</button>
            <button class="seat-btn" data-seat="C4">C4</button>

            <button class="seat-btn" data-seat="D1">D1</button>
            <button class="seat-btn" data-seat="D2">D2</button>
            <button class="seat-btn" data-seat="D3">D3</button>
            <button class="seat-btn" data-seat="D4">D4</button>

            <button class="seat-btn" data-seat="E1">E1</button>
            <button class="seat-btn" data-seat="E2">E2</button>
            <button class="seat-btn" data-seat="E3">E3</button>
            <button class="seat-btn" data-seat="E4">E4</button>

            <button class="seat-btn" data-seat="F1">F1</button>
            <button class="seat-btn" data-seat="F2">F2</button>
            <button class="seat-btn" data-seat="F3">F3</button>
            <button class="seat-btn" data-seat="F4">F4</button>

        </div>

        <p>
            Selected Seats:
            <span id="selectedSeats">None</span>
        </p>

        <p>
            Total Amount:
            ₹<span id="seatTotal">0</span>
        </p>

        <button type="button" id="continueBooking">
            Continue
        </button>

        <div class="waiting-section" id="waitingSection">

            <h3>All Seats Are Booked!</h3>

            <p>
                Sorry! No available seats for this journey.
                You can join the waiting list.
            </p>

            <button type="button" id="joinWaiting">
                Join Waiting List
            </button>

            <p class="waiting-message" id="waitingMessage"></p>

        </div>

    </div>

</main>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const waitForUser = () => new Promise((resolve) => {
    const unsubscribe = onAuthStateChanged(auth, user => {
        unsubscribe();
        resolve(user);
    });
});

function makeJourneyId(source, destination, date, transport, transportName) {
    return [source, destination, date, transport, transportName]
        .map(value => String(value || "").trim().toLowerCase())
        .join("__")
        .split("/")
        .join("%2F");
}

document.addEventListener("DOMContentLoaded", async () => {
    const user = await waitForUser();
    if (!user) {
        alert("Please log in before selecting seats.");
        location.href = "login.html";
        return;
    }

    const seats = [...document.querySelectorAll(".seat-btn")];
    const selectedSeatsText = document.getElementById("selectedSeats");
    const seatTotal = document.getElementById("seatTotal");
    const continueBtn = document.getElementById("continueBooking");
    const waitingSection = document.getElementById("waitingSection");
    const joinWaiting = document.getElementById("joinWaiting");

    const seatPrice = Number(localStorage.getItem("selectedFare")) || 500;
    const source = localStorage.getItem("source") || "";
    const destination = localStorage.getItem("destination") || "";
    const journeyDate = localStorage.getItem("journeyDate") || "";
    const transport = localStorage.getItem("selectedTransportType") || localStorage.getItem("transportMode") || "Travel";
    const transportName = localStorage.getItem("selectedTransportName") || "";

    if (!source || !destination || !journeyDate) {
        alert("Journey details are missing. Please search for a journey again.");
        location.href = "index.html";
        return;
    }

    const journeyId = makeJourneyId(source, destination, journeyDate, transport, transportName);
    localStorage.setItem("currentJourneyId", journeyId);

    seats.forEach(seat => { seat.disabled = true; });
    try {
        const bookedQuery = query(collection(db, "bookedSeats"), where("journeyId", "==", journeyId));
        const snapshot = await getDocs(bookedQuery);
        const booked = new Set(snapshot.docs.map(item => item.data().seatNumber));

        seats.forEach(seat => {
            const number = seat.dataset.seat;
            if (booked.has(number)) {
                seat.classList.add("booked");
                seat.disabled = true;
                seat.title = "Already booked";
            } else {
                seat.disabled = false;
            }
        });
    } catch (error) {
        console.error("Could not load booked seats:", error);
        alert("Unable to load seat availability. Please check Firestore Rules and try again.");
        return;
    }

    let selectedSeats = [];
    function updateSeatDetails() {
        selectedSeatsText.textContent = selectedSeats.length ? selectedSeats.join(", ") : "None";
        const total = selectedSeats.length * seatPrice;
        seatTotal.textContent = total.toLocaleString("en-IN");
        localStorage.setItem("selectedSeats", JSON.stringify(selectedSeats));
        localStorage.setItem("selectedSeatNumbers", JSON.stringify(selectedSeats));
        localStorage.setItem("totalAmount", String(total));
    }

    seats.forEach(seat => {
        seat.addEventListener("click", () => {
            if (seat.disabled || seat.classList.contains("booked")) return;
            const number = seat.dataset.seat;
            if (selectedSeats.includes(number)) {
                selectedSeats = selectedSeats.filter(item => item !== number);
                seat.classList.remove("selected");
            } else {
                if (selectedSeats.length >= 6) {
                    alert("You can select a maximum of 6 seats.");
                    return;
                }
                selectedSeats.push(number);
                seat.classList.add("selected");
            }
            updateSeatDetails();
        });
    });

    if (seats.every(seat => seat.disabled)) waitingSection.style.display = "block";

    continueBtn.addEventListener("click", () => {
        if (!selectedSeats.length) {
            alert("Please select at least one available seat.");
            return;
        }
        updateSeatDetails();
        location.href = "passenger.html";
    });

    if (joinWaiting) {
        joinWaiting.addEventListener("click", () => {
            document.getElementById("waitingMessage").textContent =
                "Waiting-list request noted for this demo. No seat has been reserved.";
        });
    }
});
</script>

</body>
</html>
